name: JVM tests

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[no ci]')
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run JVM tests
        id: tests
        run: ./gradlew test --continue --no-daemon --console=plain

      - name: Summarize test results
        id: summary
        if: ${{ !cancelled() }}
        shell: python
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path("build").glob("**/test-results/**/TEST-*.xml"))
          totals = dict.fromkeys(("tests", "failures", "errors", "skipped"), 0)
          for report in reports:
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, 0))

          failed = totals["failures"] + totals["errors"]
          passed = totals["tests"] - failed - totals["skipped"]
          summary = (
              f"{totals['tests']} tests: {passed} passed, "
              f"{failed} failed, {totals['skipped']} skipped."
              if reports else "No JUnit XML reports were produced."
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"summary={summary}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(f"## JVM test results\n\n{summary}\n")
          if totals["tests"] == 0 and os.environ["TEST_OUTCOME"] == "success":
              raise SystemExit("Gradle succeeded without producing any test results.")

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/**/test-results/**/TEST-*.xml
            build/**/reports/tests/**
          if-no-files-found: warn

  notify:
    needs: test
    if: ${{ always() && needs.test.result != 'skipped' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify Telegram about test results
        shell: python
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          TEST_RESULT: ${{ needs.test.result }}
          TEST_SUMMARY: ${{ needs.test.outputs.summary }}
        run: |
          import json
          import os
          from html import escape
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          token = os.environ["TG_BOT_TOKEN"]
          chat_id = os.environ["TG_CHAT_ID"]
          if not token or not chat_id:
              print("::notice::Telegram notification skipped: bot token or chat ID is not configured.")
              raise SystemExit(0)

          result = os.environ["TEST_RESULT"]
          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["GITHUB_REF_NAME"]
          revision = os.environ["GITHUB_SHA"][:7]
          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/{repository}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          summary = os.environ["TEST_SUMMARY"] or "Test execution did not produce a summary."
          text = (
              f"<blockquote><b>🧪 JVM tests: {escape(result.upper())}</b>\n"
              f"<code>{escape(repository)}:{escape(branch)}</code>\n"
              f"Commit: <code>{escape(revision)}</code>\n"
              f"{escape(summary)}\n"
              f'<a href="{escape(run_url, quote=True)}">View run and test reports</a></blockquote>'
          )
          payload = {"chat_id": chat_id, "parse_mode": "HTML", "text": text,
                     "disable_web_page_preview": True}
          if os.environ["TG_THREAD_ID"]:
              payload["message_thread_id"] = int(os.environ["TG_THREAD_ID"])
          request = Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except HTTPError as error:
              raise SystemExit(f"Telegram notification failed: HTTP {error.code}.") from None
          except URLError:
              raise SystemExit("Telegram notification failed: network error.") from None
          if not result.get("ok"):
              raise SystemExit("Telegram rejected the notification: " + result.get("description", "unknown error"))
