modLoader = "javafml"
loaderVersion = "[4,)"
license = "${license}"

# The same jar carries the Fabric version; this stops Sinytra Connector from loading it a second time as a Fabric mod.
[properties]
"connector:placeholder" = true

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = "${mod_name}"

[[mixins]]
config = "hollowengine.mixins.json"
[[mixins]]
config = "hollowengine-neoforge.mixins.json"
[[mixins]]
config = "hollowengine-neoforge.bridge.mixins.json"
[[mixins]]
config = "hollowengine-neoforge.scripts.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"
